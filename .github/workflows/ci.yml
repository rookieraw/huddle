name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (identity)
        working-directory: libs/identity
        run: pnpm exec prisma generate --schema=./src/infrastructure/prisma/schema.prisma

      - name: Build
        run: pnpm -r run build

      - name: Lint
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit tests
        run: pnpm -r run test

      # Integration and E2E tests (Testcontainers, real Postgres) exist as of Phase 1 —
      # libs/identity's test:integration and apps/api-gateway's test:e2e — but aren't
      # wired into this workflow yet. Deferred as its own step: needs Docker-in-Docker
      # on the runner (untested here so far) and adds real runtime cost per push.
