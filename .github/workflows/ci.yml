name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (identity)
        working-directory: libs/identity
        run: pnpm exec prisma generate --schema=./src/infrastructure/prisma/schema.prisma

      - name: Build
        run: pnpm -r run build

      - name: Lint
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit tests
        run: pnpm -r run test

      # Testcontainers-backed suites — real ephemeral Postgres via the Docker daemon
      # already present on ubuntu-latest runners, no services: block or DinD needed.
      - name: Integration tests
        run: pnpm --filter @huddle/identity test:integration

      - name: E2E tests
        run: pnpm --filter api-gateway test:e2e
